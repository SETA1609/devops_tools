# Reusable: check the changelog fragments of a pull request, and that its branch's issue has one.
# The caller runs it on pull_request with contents: read.
name: Changelog fragments

on:
  workflow_call:
    inputs:
      devops-tools-version:
        description: Full 40-character commit SHA of SETA1609/devops_tools to run, the same one the caller pins this workflow to.
        required: true
        type: string
      settings-file:
        description: pyproject.toml with the [tool.devops-tools] table, relative to the repository root. Empty means the root pyproject.toml.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check-changelog-fragments:
    name: Check changelog fragments
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the devops-tools scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SETA1609/devops_tools
          ref: ${{ inputs.devops-tools-version }}
          path: devops-tools-checkout
          persist-credentials: false

      - name: Check the devops-tools version
        env:
          DEVOPS_TOOLS_VERSION: ${{ inputs.devops-tools-version }}
        run: bash "$GITHUB_WORKSPACE/devops-tools-checkout/scripts/workflows/check_devops_tools_version.sh"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.12"
          python-version: "3.13"

      - name: Check out the calling repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: calling-repository
          persist-credentials: false

      - name: Check changelog fragments
        working-directory: calling-repository
        env:
          DEVOPS_TOOLS_VERSION: ${{ inputs.devops-tools-version }}
          SETTINGS_FILE: ${{ inputs.settings-file }}
          PULL_REQUEST_BRANCH: ${{ github.head_ref }}
        run: bash "$GITHUB_WORKSPACE/devops-tools-checkout/scripts/workflows/run_changelog_fragments_check.sh"
