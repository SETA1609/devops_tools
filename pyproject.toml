[project]
name = "devops-tools"
version = "0.2.0"
description = "Shared devops tooling: timestamped run logs, log pruning, and repository workflow helpers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
# Runtime uses the standard library only. A project needs nothing but uv.
dependencies = []

[project.scripts]
devops-tools = "devops_tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
